<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>飾金折扣計算器</title>
  <style>
    :root{--wine:#8B2A2E;--wine-dark:#6F1E22;--gold:#C8A55A;--bg:#FCF8F2;--card:#fff;--text:#1B1B1B;--muted:#6A6156;--border:rgba(200,165,90,.36);--shadow:0 18px 42px rgba(20,10,5,.10);--shadow-soft:0 10px 22px rgba(20,10,5,.06);--radius:22px}
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;color:var(--text);background:radial-gradient(900px 400px at 0 0,rgba(200,165,90,.18),transparent 55%),radial-gradient(900px 400px at 100% 0,rgba(139,42,46,.10),transparent 55%),linear-gradient(180deg,#fff,var(--bg))}
    .wrap{max-width:1240px;margin:0 auto}.hero{padding:20px;border:1px solid var(--border);border-radius:calc(var(--radius) + 8px);background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(200,165,90,.08));box-shadow:var(--shadow)}
    h1{margin:0 0 8px;color:var(--wine-dark);font-size:30px}.sub{max-width:980px;color:var(--muted);font-size:14px;line-height:1.8}.chipRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.chip{padding:8px 12px;border:1px solid rgba(200,165,90,.5);border-radius:999px;background:rgba(200,165,90,.12);color:var(--wine-dark);font-size:12px;font-weight:800}
    .layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}@media(max-width:980px){.layout{grid-template-columns:1fr}}.card{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-soft)}
    .sectionTitle{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}.sectionTitle .t{color:var(--wine-dark);font-size:14px;font-weight:950}.sectionTitle .s,label{color:var(--muted);font-size:12px}.field{margin-bottom:12px}label{display:block;margin:0 0 6px 2px}input,select{width:100%;padding:12px 13px;border:1px solid rgba(0,0,0,.12);border-radius:16px;background:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:rgba(200,165,90,.8);box-shadow:0 0 0 3px rgba(200,165,90,.16)}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .priceSync{padding:12px;margin-bottom:12px;border:1px solid rgba(200,165,90,.42);border-radius:18px;background:linear-gradient(135deg,rgba(200,165,90,.10),rgba(139,42,46,.05))}.syncValue{color:var(--wine-dark);font-size:30px;font-weight:980;line-height:1.05}.syncSub{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.65}.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}button{padding:12px 16px;border:0;border-radius:16px;font-size:14px;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--wine),var(--wine-dark));box-shadow:0 12px 24px rgba(139,42,46,.18)}.secondary{border:1px solid rgba(200,165,90,.58);background:#fff;color:var(--text)}button:disabled{opacity:.55;cursor:wait}
    .summaryGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media(max-width:900px){.summaryGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.summaryGrid{grid-template-columns:1fr}}.metric{min-height:108px;padding:14px;border:1px solid rgba(0,0,0,.08);border-radius:18px;background:linear-gradient(135deg,rgba(200,165,90,.08),rgba(139,42,46,.04))}.metric .k{margin-bottom:8px;color:var(--muted);font-size:12px}.metric .v{color:var(--wine-dark);font-size:28px;font-weight:980}.metric .x{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}
    .tableWrap{margin-top:14px;overflow:auto;border:1px solid rgba(200,165,90,.32);border-radius:20px;background:#fff;box-shadow:var(--shadow-soft)}table{width:100%;min-width:820px;border-collapse:collapse}th{padding:14px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(200,165,90,.28);background:linear-gradient(135deg,rgba(139,42,46,.08),rgba(200,165,90,.10));color:var(--wine-dark);font-size:12px}td{padding:14px;border-bottom:1px solid rgba(0,0,0,.06);font-size:14px;vertical-align:top}.rank,.scenarioName,.rounded{font-weight:900}.rank,.scenarioName,.amount{color:var(--wine-dark)}.formula{min-width:260px;color:var(--muted);font-size:13px;line-height:1.7}.amount{font-size:20px;font-weight:980;white-space:nowrap}
    .note,.copyBox{margin-top:14px;padding:12px 14px;border-radius:18px;font-size:12px;line-height:1.7}.note{border:1px dashed rgba(200,165,90,.58);background:rgba(200,165,90,.10);color:var(--muted)}.copyBox{min-height:120px;border:1px solid rgba(0,0,0,.08);background:#fff;white-space:pre-wrap;font-size:13px}.status-ok{color:#1F7A4D}.status-warn{color:#9A6400}.status-error{color:#B42318}
  </style>
</head>
<body>
  <div class="wrap"><div class="hero">
    <h1>飾金折扣計算器</h1>
    <div class="sub">此工具會自動讀取今日飾金售出價。輸入金重及工費後，可比較四個已確認的報價方案。</div>
    <div class="chipRow"><div class="chip">同步今日金價</div><div class="chip">支援克／両</div><div class="chip">失敗時可手動輸入</div></div>
    <div class="layout">
      <div class="card">
        <div class="sectionTitle"><div class="t">輸入資料</div><div class="s">更改欄位後即時更新</div></div>
        <div class="twoCol"><div class="field"><label>金重單位</label><select id="unit"><option value="克">克</option><option value="両">両</option></select></div><div class="field"><label>貨幣</label><input value="HK$" readonly /></div></div>
        <div class="priceSync"><label>今日飾金售出價</label><div class="syncValue" id="liveGoldPrice">—</div><div class="syncSub" id="goldPriceStatus">正在讀取今日金價…</div><div class="btnRow"><button class="primary" id="refreshPriceBtn" type="button">刷新金價</button><button class="secondary" id="applyPriceBtn" type="button">引用今日金價</button></div></div>
        <div class="field"><label>飾金售出價（每克／每両）</label><input id="sellPrice" type="number" step="0.01" inputmode="decimal" placeholder="系統會自動帶入，亦可手動修改" /></div>
        <div class="field"><label>金重</label><input id="weight" type="number" step="0.001" inputmode="decimal" placeholder="例如：1.234" /></div>
        <div class="field"><label>工費</label><input id="laborFee" type="number" step="0.01" inputmode="decimal" placeholder="例如：2000" /></div>
        <div class="btnRow"><button class="primary" id="copyBtn" type="button">複製摘要</button><button class="secondary" id="resetBtn" type="button">重新輸入</button></div>
        <div class="note"><strong>計算方式：</strong><br>1. 金價金額 = 售出價 × 金重<br>2. 金價讀取失敗時，可手動輸入售出價。</div>
        <div class="copyBox" id="copyText">請先輸入資料，系統會自動生成可複製內容。</div>
      </div>
      <div><div class="card"><div class="sectionTitle"><div class="t">基礎拆解</div><div class="s">金價金額與正價</div></div><div class="summaryGrid">
        <div class="metric"><div class="k">金價金額</div><div class="v" id="goldAmount">—</div><div class="x">售出價 × 金重</div></div>
        <div class="metric"><div class="k">工費</div><div class="v" id="laborAmount">—</div><div class="x">手動輸入</div></div>
        <div class="metric"><div class="k">正價</div><div class="v" id="regularAmount">—</div><div class="x">金價金額 + 工費</div></div>
      </div></div><div class="tableWrap"><table><thead><tr><th>排序</th><th>情景</th><th>公式</th><th>金額</th><th>取整參考</th></tr></thead><tbody id="resultsBody"></tbody></table></div></div>
    </div>
  </div></div>
<script>
  const $ = id => document.getElementById(id);
  const GOLDPRICE_PROXY = 'https://lukfook-goldprice-proxy.arwing28.workers.dev';
  const AUTO_REFRESH_MS = 5 * 60 * 1000;
  let goldPriceData = null;

  const scenarios = [
    ['正價','金價金額 + 工費',(g,l)=>g+l],
    ['半工','金價金額 +（工費 × 50%）',(g,l)=>g+l*.5],
    ['免工','金價金額',g=>g],
    ['全單 95 折','（金價金額 + 工費）× 95%',(g,l)=>(g+l)*.95]
  ];

  const isNum = x => Number.isFinite(x) && !Number.isNaN(x);
  function toNumber(value){
    if(typeof value === 'number') return isNum(value) ? value : null;
    if(typeof value !== 'string') return null;
    const cleaned = value.replace(/[,$HK\s]/gi,'').replace(/[^0-9.\-]/g,'');
    if(!cleaned) return null;
    const n = Number(cleaned);
    return isNum(n) ? n : null;
  }
  function firstNumber(obj, keys){
    for(const key of keys){
      const n = toNumber(obj?.[key]);
      if(n !== null) return n;
    }
    return null;
  }
  function findPriceRow(payload){
    if(Array.isArray(payload)) return payload.find(v=>v && typeof v==='object') || null;
    if(!payload || typeof payload!=='object') return null;
    for(const key of ['data','result','results','records','items']){
      const found = findPriceRow(payload[key]);
      if(found) return found;
    }
    return payload;
  }
  function normalisePricePayload(payload){
    const row = findPriceRow(payload);
    if(!row) throw new Error('API 沒有回傳金價資料');
    let tael = firstNumber(row,['黃金售出','飾金售出','飾金售出價','gold_sell','goldSell','sell_price','sellPrice']);
    let gram = firstNumber(row,['克黃金售出','克飾金售出','飾金每克售出','gold_sell_gram','gram_sell','gramSell']);
    if(gram === null && tael !== null) gram = tael / 37.429;
    if(tael === null && gram !== null) tael = gram * 37.429;
    if(tael === null && gram === null) throw new Error('找不到可用的飾金售出價欄位');
    return {updatedAt:row.record_date||row.updated_at||row.updatedAt||row.date||'',tael:{sell:tael},gram:{sell:gram}};
  }
  function getUnitKey(){return $('unit').value==='克'?'gram':'tael'}
  function getCurrentLivePrice(){const n=goldPriceData?.[getUnitKey()]?.sell;return isNum(n)?n:null}
  function setStatus(text,type=''){const el=$('goldPriceStatus');el.textContent=text;el.className='syncSub'+(type?' status-'+type:'')}

  async function fetchGoldPrice(){
    const btn=$('refreshPriceBtn');btn.disabled=true;setStatus('正在讀取今日金價…');
    try{
      const res=await fetch(GOLDPRICE_PROXY,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{Accept:'application/json'}});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text=await res.text();
      let json;try{json=JSON.parse(text)}catch(e){throw new Error('API 回傳內容不是有效 JSON')}
      goldPriceData=normalisePricePayload(json);renderLivePrice(true);
    }catch(e){
      console.warn('未能讀取金價，已保留手動輸入功能。');
      goldPriceData=null;$('liveGoldPrice').textContent='—';setStatus('暫時未能取得今日金價，可手動輸入售出價。','error');render();
    }finally{btn.disabled=false}
  }
  function renderLivePrice(autoApply=false){
    const price=getCurrentLivePrice(),unit=$('unit').value;
    if(isNum(price)){
      $('liveGoldPrice').textContent=`HK$ ${price.toLocaleString('zh-HK',{maximumFractionDigits:2})}／${unit}`;
      const apiTime=goldPriceData?.updatedAt?`｜更新時間：${goldPriceData.updatedAt}`:'';
      setStatus(`已同步今日飾金售出價（每${unit}）${apiTime}`,'ok');
      if(autoApply||!$('sellPrice').value) $('sellPrice').value=price.toFixed(2).replace(/\.00$/,'');
    }else{$('liveGoldPrice').textContent='—';setStatus('暫未取得此單位的可用金價。','error')}
    render();
  }
  function applyLivePrice(){const p=getCurrentLivePrice();if(isNum(p)){$('sellPrice').value=p;render()}}
  function fmtMoney(n){return isNum(n)?`HK$ ${n.toLocaleString('zh-HK',{minimumFractionDigits:2,maximumFractionDigits:2})}`:'—'}
  function fmtMoneyInt(n){return isNum(n)?`HK$ ${Math.round(n).toLocaleString('zh-HK')}`:'—'}
  function validInputNumber(value){if(String(value).trim()==='')return null;const n=Number(value);return isNum(n)?n:null}
  function getValues(){const s=validInputNumber($('sellPrice').value),w=validInputNumber($('weight').value),l=validInputNumber($('laborFee').value);return{sellPrice:s!==null&&s>0?s:NaN,weight:w!==null&&w>0?w:NaN,labor:l!==null&&l>=0?l:NaN}}
  function renderEmpty(){['goldAmount','laborAmount','regularAmount'].forEach(id=>$(id).textContent='—');$('resultsBody').innerHTML=scenarios.map((s,i)=>`<tr><td class="rank">${i+1}</td><td class="scenarioName">${s[0]}</td><td class="formula">${s[1]}</td><td class="amount">—</td><td class="rounded">—</td></tr>`).join('');$('copyText').textContent='請先輸入資料，系統會自動生成可複製內容。'}
  function render(){
    const {sellPrice,weight,labor}=getValues();if(!(sellPrice>0&&weight>0&&isNum(labor))){renderEmpty();return}
    const gold=sellPrice*weight,regular=gold+labor;
    $('goldAmount').textContent=fmtMoney(gold);$('laborAmount').textContent=fmtMoney(labor);$('regularAmount').textContent=fmtMoney(regular);
    $('resultsBody').innerHTML=scenarios.map((s,i)=>{const total=s[2](gold,labor);return `<tr><td class="rank">${i+1}</td><td class="scenarioName">${s[0]}</td><td class="formula">${s[1]}</td><td class="amount">${fmtMoney(total)}</td><td class="rounded">${fmtMoneyInt(total)}</td></tr>`}).join('');
    const unit=$('unit').value;$('copyText').textContent=['飾金折扣情景計算結果',`- 今日售出價：HK$ ${sellPrice.toLocaleString('zh-HK')}／${unit}`,`- 金重：${weight.toLocaleString('zh-HK',{maximumFractionDigits:3})} ${unit}`,`- 工費：${fmtMoney(labor)}`,`- 金價金額：${fmtMoney(gold)}`,'',...scenarios.map(s=>{const total=s[2](gold,labor);return `【${s[0]}】${fmtMoney(total)}（取整：${fmtMoneyInt(total)}）`}), '', '以上數據只作參考，一切以金星系統數據為準。'].join('\n');
  }
  async function copyResult(){const text=$('copyText').textContent.trim();if(!text||text.includes('請先輸入資料'))return;try{await navigator.clipboard.writeText(text);$('copyBtn').textContent='已複製';setTimeout(()=>$('copyBtn').textContent='複製摘要',1200)}catch(e){alert('未能自動複製，請手動複製下方內容。')}}
  function resetAll(){$('unit').value='克';$('weight').value='';$('laborFee').value='';$('sellPrice').value=getCurrentLivePrice()??'';renderLivePrice(false)}
  ['weight','sellPrice','laborFee'].forEach(id=>$(id).addEventListener('input',render));
  $('unit').addEventListener('change',()=>{const price=getCurrentLivePrice();if(isNum(price))$('sellPrice').value=price;renderLivePrice(false);render()});
  $('refreshPriceBtn').addEventListener('click',fetchGoldPrice);$('applyPriceBtn').addEventListener('click',applyLivePrice);$('copyBtn').addEventListener('click',copyResult);$('resetBtn').addEventListener('click',resetAll);
  renderEmpty();fetchGoldPrice();setInterval(fetchGoldPrice,AUTO_REFRESH_MS);
</script>
<footer style="max-width:1180px;margin:18px auto 0;padding:14px 4px;color:#554a51;font-size:12px;text-align:center;">
  以上數據只作參考，一切以金星系統數據為準。
</footer>
</body>
</html>
