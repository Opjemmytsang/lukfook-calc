<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優惠貨號查詢｜正式系統</title><style>
:root{font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#302734;background:#f7f5f7}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6dfe5;padding:18px}header strong{color:#7c2855}.wrap{max-width:720px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e8e0e7;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 5px 20px #00000008}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}label{display:block;font-weight:600;margin:14px 0 7px}input,select{width:100%;font-size:16px;border:1px solid #d8ccd5;border-radius:10px;padding:12px;background:white}button{font:inherit;background:#7c2855;color:#fff;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;margin-top:15px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#f0e6ed;color:#7c2855}.hidden{display:none}.muted{color:#766e77;font-size:13px;line-height:1.6}.notice{background:#fff5df;border:1px solid #e9d7ac;border-radius:12px;padding:14px;line-height:1.7}.error{color:#ad253b;margin-top:12px}.ok{color:#17613b}.pill{display:inline-block;background:#f1e4ed;color:#70234e;border-radius:20px;padding:7px 11px;margin:4px 4px 0 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:#7c2855}#result{margin-top:16px;line-height:1.8}
</style></head><body><header><div class="row" style="max-width:720px;margin:auto"><strong>優惠貨號查詢</strong><a href="../index.html">返回首頁</a></div></header><main class="wrap"><h1>貨品優惠查詢</h1><p class="muted">分行只可查詢單一貨號；優惠以已審批及有效資料為準。</p>
<div id="status" class="notice" role="status">正在檢查安全查詢服務……</div>
<section id="login" class="card hidden"><h2>分行／營運部登入</h2><label for="username">分行代碼／管理員帳號</label><input id="username" autocomplete="username" autocapitalize="characters" maxlength="32"><label for="password">數字密碼</label><input id="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="16"><button id="loginBtn">登入</button><div id="loginError" class="error" role="alert"></div></section>
<section id="app" class="hidden"><div class="row"><p id="identity" class="muted"></p><button id="logout" class="secondary">登出</button></div><div class="card"><h2>查詢優惠</h2><label for="region">地區</label><select id="region"><option value="港澳">香港／澳門</option><option value="海外">海外</option></select><label for="code">完整貨號</label><input id="code" autocapitalize="characters" autocomplete="off" maxlength="64" placeholder="輸入完整貨號"><button id="searchBtn">查詢</button><div id="result" aria-live="polite"></div></div><section id="admin" class="card hidden"><h2>營運管理</h2><p class="muted">正式資料更新須經後端權限驗證、差異預覽及審批後發布。此頁不會在瀏覽器儲存或直接上傳公司 Excel。</p><div id="adminStatus"></div></section></section>
<p class="muted">資料保護：本網頁不包含優惠清單、公開測試密碼或 GitHub 存取權杖。沒有連接安全服務時，查詢會保持停用。</p></main>
<script>
"use strict";
const $=id=>document.getElementById(id),API_URL=""; // 部署安全後端後填入 HTTPS API 根網址（不含尾斜線）
let token=null,user=null;
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(message,ready=false){$("status").textContent=message;$("status").className=ready?"notice ok":"notice"}
async function request(route,options={}){if(!API_URL)throw Error("安全查詢服務尚未部署，正式查詢暫未啟用。");const response=await fetch(API_URL+route,{...options,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})},cache:"no-store"});let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(response.status===401?"登入已失效，請重新登入。":body.error||"服務回應錯誤（"+response.status+"）");return body}
async function init(){if(!API_URL){status("尚未連接安全查詢後端。真實資料查詢及登入暫停，避免顯示不實結果。");return}try{await request("/health");status("安全查詢服務已連接。",true);$("login").classList.remove("hidden")}catch(e){status("安全查詢服務無法使用："+e.message)}}
$("password").oninput=()=>{$("password").value=$("password").value.replace(/\D/g,"")};
$("loginBtn").onclick=async()=>{const username=$("username").value.trim().toUpperCase(),password=$("password").value;if(!/^[A-Z0-9-]{2,32}$/.test(username)||!/^[0-9]{4,16}$/.test(password)){$("loginError").textContent="請輸入有效帳號及 4–16 位數字密碼。";return}const b=$("loginBtn");b.disabled=true;$("loginError").textContent="";try{const data=await request("/auth/login",{method:"POST",body:JSON.stringify({username,password})});if(!data.token||!data.user)throw Error("登入回應不完整");token=data.token;user=data.user;$("password").value="";$("login").classList.add("hidden");$("app").classList.remove("hidden");$("identity").textContent=(user.name||username)+" · "+(user.role==="admin"?"營運管理員":"分行員工");$("admin").classList.toggle("hidden",user.role!=="admin")}catch(e){$("loginError").textContent=e.message}finally{b.disabled=false}};
$("logout").onclick=()=>{token=null;user=null;$("app").classList.add("hidden");$("login").classList.remove("hidden");$("result").textContent=""};
$("searchBtn").onclick=async()=>{const code=$("code").value.trim().toUpperCase(),region=$("region").value;if(!code||code.length>64){$("result").textContent="請輸入完整貨號。";return}const btn=$("searchBtn");btn.disabled=true;$("result").textContent="查詢中……";try{const data=await request("/offers/lookup",{method:"POST",body:JSON.stringify({code,region})});const matches=Array.isArray(data.offers)?data.offers:[];$("result").innerHTML='<strong>'+escapeHTML(code)+'</strong><p class="'+(matches.length?"ok":"muted")+'">'+(matches.length?"找到適用優惠：":"沒有已核准的適用優惠記錄。")+'</p>'+matches.map(o=>'<span class="pill">'+escapeHTML(typeof o==="string"?o:o.name)+'</span>').join("")+'<p class="muted">資料版本：'+escapeHTML(data.version||"未提供")+'；實際售價及適用條件以正式通告及系統為準。</p>'}catch(e){$("result").textContent="查詢失敗："+e.message}finally{btn.disabled=false}};
$("code").onkeydown=e=>{if(e.key==="Enter")$("searchBtn").click()};init();
</script></body></html>
